<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 364" width="760" height="364" role="img" aria-label="Test: does Qwen continue GPT-2 text more like GPT-2 than like itself" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8a80"/></marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
  </defs>
  <rect width="760" height="364" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1a1a1a">Test: does Qwen continue GPT-2's text more like GPT-2 than like itself?</text>

  <g fill="none" stroke="#8a8a80" stroke-width="1.25">
    <path d="M156 164H177V84H198" marker-end="url(#arrow)"/>
    <path d="M342 84H380" marker-end="url(#arrow)"/>
    <path d="M524 84H560" marker-end="url(#arrow)"/>
    <path d="M452 108V140" marker-end="url(#arrow)"/>
    <path d="M156 164H380" marker-end="url(#arrow)"/>
    <path d="M524 164H560" marker-end="url(#arrow)"/>
    <path d="M90 188V244H380" marker-end="url(#arrow)"/>
    <path d="M524 244H560" marker-end="url(#arrow)"/>
  </g>

  <g fill="none" stroke="#2563eb" stroke-width="1.25">
    <path d="M704 84H724M704 164H724M704 244H724"/>
    <path d="M724 84V316H700" marker-end="url(#arrow-accent)"/>
  </g>

  <g fill="none" stroke="#8a8a80" stroke-width="1.25">
    <rect x="24" y="140" width="132" height="48" rx="8"/>
    <rect x="198" y="60" width="144" height="48" rx="8"/>
    <rect x="380" y="60" width="144" height="48" rx="8"/>
    <rect x="560" y="60" width="144" height="48" rx="8" stroke-dasharray="4 4"/>
    <rect x="380" y="140" width="144" height="48" rx="8"/>
    <rect x="560" y="140" width="144" height="48" rx="8"/>
    <rect x="380" y="220" width="144" height="48" rx="8"/>
    <rect x="560" y="220" width="144" height="48" rx="8"/>
  </g>

  <g text-anchor="middle" font-weight="600" fill="#1a1a1a">
    <text x="90" y="162">Headline</text>
    <text x="270" y="82">GPT-2 writes</text>
    <text x="452" y="82">P: opening</text>
    <text x="632" y="82">G: next words</text>
    <text x="452" y="162">Qwen reads</text>
    <text x="632" y="162">M: Qwen's</text>
    <text x="452" y="242">Qwen reads H</text>
    <text x="632" y="242">N: Qwen's own</text>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#555555">
    <text x="90" y="178">(H)</text>
    <text x="270" y="98">an article</text>
    <text x="452" y="98">(shown to Qwen)</text>
    <text x="632" y="98">(hidden from Qwen)</text>
    <text x="452" y="178">H + P, continues</text>
    <text x="632" y="178">continuation</text>
    <text x="452" y="258">only, writes freely</text>
    <text x="632" y="258">free writing</text>
  </g>

  <rect x="300" y="292" width="400" height="48" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/>
  <text x="500" y="314" text-anchor="middle" font-weight="600" fill="#1a1a1a">Is M closer to G than N is?</text>
  <text x="500" y="330" text-anchor="middle" font-size="11.5" fill="#555555">Chopra reports yes, on several overlap metrics</text>
</svg>
